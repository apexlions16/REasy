name: Build Fork Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Artifact/package name"
        required: false
        default: "REasy-fork-audio-modding"
  push:
    branches:
      - master
    paths:
      - "REasy.py"
      - "build.bat"
      - "setup.py"
      - "requirements.txt"
      - "version.txt"
      - "file_handlers/**"
      - "ui/**"
      - "tools/**"
      - "utils/**"
      - "native/**"
      - "resources/**"
      - "scripts/**"
      - ".github/workflows/build-fork-package.yml"

permissions:
  contents: read

env:
  CI: "true"

jobs:
  build-windows-exe:
    name: Build unsigned Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Upgrade pip tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build REasy unsigned package
        shell: cmd
        run: build.bat

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/REasy.exe")) {
            throw "dist/REasy.exe was not created."
          }
          Get-Item "dist/REasy.exe" | Format-List Name,Length,FullName

      - name: Create ZIP package
        shell: pwsh
        run: |
          $packageName = "${{ github.event.inputs.package_name }}"
          if ([string]::IsNullOrWhiteSpace($packageName)) {
            $packageName = "REasy-fork-audio-modding"
          }
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $zipName = "$packageName-$shortSha.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw dist folder
        uses: actions/upload-artifact@v4
        with:
          name: REasy-dist-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
